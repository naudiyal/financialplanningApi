spring.application.name=financial-planning-api
server.port=8080
server.forward-headers-strategy=framework
app.ui.url=${APP_UI_URL:http://localhost:5173}
app.datasource.url=${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financial_planning}
app.datasource.username=${APP_DATASOURCE_USERNAME:financial_app}
app.datasource.password=${APP_DATASOURCE_PASSWORD:}

spring.datasource.url=${app.datasource.url}
spring.datasource.username=${app.datasource.username}
spring.datasource.password=${app.datasource.password}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email